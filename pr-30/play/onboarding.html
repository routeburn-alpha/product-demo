							node_ids: [0, 3],
							data: [null,{type:"data",data:{pack:{id:"onboarding",title:"New-Hire Onboarding",category:"Onboarding",description:"Your first week at Quiz Lab — how it's built, how it ships, and how work flows through Studio AI.",coverColor:"#1f6feb",coverEmoji:"🧭",addedAt:"2026-06-01",questions:[{id:"onb-content-1",prompt:"In the Quiz Lab repo, where do the quiz pack files live?",choices:["In static/quizzes/, one file per quiz","In app/src/lib/data/packs/, one JSON file per pack","In a Postgres table managed by a content API","Inside app/src/routes/, next to the page components"],correctIndex:1,difficulty:1,explanation:"Each pack is a single JSON file in app/src/lib/data/packs/, which the loader (packs.ts) reads directly. The static/quizzes/ path is from the deprecated v0 format and is no longer used. (Architecture Overview; ARCHITECTURE.md)"},{id:"onb-content-2",prompt:"How does a merged content change actually reach the live Quiz Lab site?",choices:["It's pushed to a Vercel deployment with worldwide edge caching","An admin uploads the new pack through a dashboard","A nightly cron job syncs the packs into a database","Merging to main triggers a GitHub Actions build that publishes the static site to GitHub Pages"],correctIndex:3,difficulty:2,explanation:"The whole deploy pipeline is: merge to main → GitHub Actions builds the static site → it's published to GitHub Pages. There is no Vercel deployment and no manual upload step. (Architecture Overview; ONBOARDING.md §5)"},{id:"onb-content-3",prompt:"What backend database does Quiz Lab use to store packs in v1?",choices:["Postgres","DynamoDB","None — it's a fully prerendered static site and all content ships in the build","A SQLite file committed to the repo"],correctIndex:2,difficulty:2,explanation:"Quiz Lab is intentionally backend-less in v1: a static SvelteKit app (adapter-static + prerender) served from GitHub Pages, with all content shipped in the build. Marketing copy that mentions Postgres is aspirational, not the live architecture. (ARCHITECTURE.md; Architecture Overview)"},{id:"onb-content-4",prompt:"What is the entire process for adding a new pack to Quiz Lab?",choices:["Run a database migration, then redeploy the API","Drop a new JSON file into the packs directory and open a PR — no backend changes","Add a row through the analytics dashboard","Edit static/quizzes/ and call the content API to reindex"],correctIndex:1,difficulty:1,explanation:"Adding a pack is one file change plus one PR: drop a JSON file in app/src/lib/data/packs/ and open a PR. There's no backend and no migration. (README 'Adding a new pack'; Architecture Overview)"},{id:"onb-dev-1",prompt:"How do you run Quiz Lab locally, and what URL does the dev server use?",choices:["npm run dev → http://localhost:5173","npm run dev → http://localhost:3000","npm start → http://localhost:8080","vercel dev → http://localhost:5173"],correctIndex:0,difficulty:1,explanation:"From the app/ directory you run npm install then npm run dev, which serves on http://localhost:5173. (README 'Getting started'; Architecture Overview 'Local development')"},{id:"onb-dev-2",prompt:"What must pass before a Quiz Lab PR can merge?",choices:["A manual QA sign-off in the dashboard","A passing database migration","npm run build — a broken build blocks the GitHub Pages deploy","Nothing automated; merges are unrestricted"],correctIndex:2,difficulty:2,explanation:"npm run build (in app/) must pass before a PR merges, because a broken build would block the Pages deploy. (Architecture Overview 'Local development'; task spec)"},{id:"onb-dev-3",prompt:"Which stack is Quiz Lab actually built on?",choices:["Next.js deployed on Vercel","React Native with Expo","SvelteKit 2 + Svelte 5 (runes mode), built with Vite and @sveltejs/adapter-static","A plain static HTML site with no build step"],correctIndex:2,difficulty:3,explanation:"Quiz Lab is SvelteKit 2 with Svelte 5 in runes mode, bundled by Vite and output by @sveltejs/adapter-static for GitHub Pages. React Native is only an unscheduled roadmap idea, and there is no Next.js/Vercel. (ARCHITECTURE.md 'Tech Stack')"},{id:"onb-schema-1",prompt:"In the current pack schema, how many choices must each question have?",choices:["Exactly 4","Any number, usually 3","Between 2 and 6","At least 4"],correctIndex:0,difficulty:1,explanation:"A question's choices is a 4-tuple — exactly 4 options. The 'any length, often 3' rule belongs to the deprecated v0 format. (Pack Authoring Guide; packs.ts type [string, string, string, string])"},{id:"onb-schema-2",prompt:"How is the correct answer recorded on a question?",choices:["As a string in a 'correct' field","As correctIndex, an integer from 0 to 3 pointing into the choices array","As a boolean flag on each choice","In a separate answer-key file"],correctIndex:1,difficulty:2,explanation:"The correct answer is correctIndex, an integer 0–3 indexing into choices. Storing the answer as a 'correct' string is the old v0 shape and is invalid now. (Pack Authoring Guide; ARCHITECTURE.md 'Data Model')"},{id:"onb-schema-3",prompt:"Besides id, prompt, and choices, which fields does every question require?",choices:["Only a 'correct' string; difficulty and explanation are optional","correctIndex, difficulty (1–3), and explanation","tags and a coverEmoji","A timestamp and an author handle"],correctIndex:1,difficulty:2,explanation:"Every question needs correctIndex (0–3), difficulty (1–3, where 1 = easy and 3 = hard), and an explanation shown after answering. The v0 format had no difficulty or explanation. (Pack Authoring Guide; ARCHITECTURE.md 'Data Model')"},{id:"onb-studio-1",prompt:"In the Studio AI MCP workflow, which tool do you use to start work on a task?",choices:["work_on_next_task — it marks the task inProgress and assigns it to the agent","submit_for_review","create_task","load_product_context"],correctIndex:0,difficulty:1,explanation:"work_on_next_task picks up a task (a specific number, or the oldest backlog item), moves it to inProgress, and binds it to the agent. (ONBOARDING.md §10; Studio AI SDLC & MCP)"},{id:"onb-studio-2",prompt:"How does a task move into the 'review' state?",choices:["Any inProgress task is reviewed automatically every night","By deploying it to production","A reviewer manually drags it there after the PR merges","By submitting work with a PR (via submit_for_review); merging the PR then auto-transitions it to done"],correctIndex:3,difficulty:2,explanation:"Submitting work with a PR moves the task to review and assigns reviewers; without a PR it goes straight to done. When the PR is merged, the task auto-transitions to done. (ONBOARDING.md §7 & §9; Studio AI SDLC & MCP)"},{id:"onb-studio-3",prompt:"How many agents or people can hold a given task in 'inProgress' at the same time?",choices:["Unlimited — tasks are collaborative by default","Exactly one; another agent must wait until it's released or moved on","Up to one per branch","Two: an author and a reviewer"],correctIndex:1,difficulty:3,explanation:"Only one agent or person can have a task inProgress at a time; a second pick-up attempt fails until the current owner releases it. (ONBOARDING.md §7 'Task')"}]}},uses:{params:["pack"]}}],
