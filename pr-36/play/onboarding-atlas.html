						kit.start(app, element, {
							node_ids: [0, 3],
							data: [null,{type:"data",data:{pack:{id:"onboarding-atlas",title:"Squad Atlas Onboarding",category:"Onboarding",description:"Week-one essentials for engineers joining Squad Atlas (Payments) at Meridian — on-call, compliance, releases, data handling, architecture, ownership, and secrets.",coverColor:"#1E3A8A",coverEmoji:"💳",addedAt:"2026-06-01",questions:[{id:"atlas-oncall-tool",prompt:"Which tool does Squad Atlas use to run its on-call rotation and paging?",choices:["PagerDuty","Opsgenie","VictorOps","Splunk On-Call"],correctIndex:1,difficulty:1,explanation:"Atlas runs its on-call rotation through Opsgenie; keep the Opsgenie app installed before your first shift (Squad Atlas — On-Call Runbook)."},{id:"atlas-oncall-sla",prompt:"When an Opsgenie alert pages the Atlas primary on-call engineer, what is the acknowledgement SLA before it escalates?",choices:["5 minutes","10 minutes","15 minutes","30 minutes"],correctIndex:1,difficulty:2,explanation:"Alerts route to the primary on-call with a 10-minute acknowledgement SLA; miss it and Opsgenie escalates to the secondary, then the squad lead (Squad Atlas — On-Call Runbook)."},{id:"atlas-severity",prompt:"On Squad Atlas, a failed payment settlement is classified as which incident severity?",choices:["Sev1","Sev2","Sev3","Sev4"],correctIndex:0,difficulty:2,explanation:"Severity is set by impact to money movement, not alert volume. A failed settlement means money movement is impacted, so it is always Sev1 — never downgrade it to Sev2 because 'only a few payments' failed (Squad Atlas — On-Call Runbook)."},{id:"atlas-compliance",prompt:"Because Atlas handles cardholder data directly, which compliance regime does the squad operate under?",choices:["PCI-DSS Level 1","PCI-DSS Level 4","SOC 2 Type II","ISO 27001"],correctIndex:0,difficulty:2,explanation:"As the highest-volume card processor at Meridian, Atlas operates under PCI-DSS Level 1 — the strictest tier. Treat it as the baseline behind every design decision (Squad Atlas — Compliance & Data Handling)."},{id:"atlas-data-tier",prompt:"How is card data classified under Meridian's data tiers, as applied by Atlas?",choices:["Tier 0 (Restricted)","Tier 1 (Confidential)","Tier 2 (Internal)","Tier 3 (Public)"],correctIndex:0,difficulty:2,explanation:"Card data is Tier 0 (Restricted), Meridian's highest tier: it may never be logged, never appear in error messages, and never leave a PCI-scope service boundary (Squad Atlas — Compliance & Data Handling)."},{id:"atlas-pan",prompt:"How does Atlas handle the Primary Account Number (PAN) in its storage?",choices:["Encrypted with AES-256 in the ledger","Tokenized at rest — a raw PAN is never persisted","Hashed with SHA-256 before storage","Stored in a dedicated PAN vault table"],correctIndex:1,difficulty:3,explanation:"The PAN is tokenized at rest: the tokenization service exchanges it for a token at the edge, and only the token flows through Rail into Atlas datastores. A raw PAN anywhere is a Tier 0 incident — page on-call (Squad Atlas — Compliance & Data Handling)."},{id:"atlas-deploy-policy",prompt:"What is Squad Atlas's production deploy policy regarding timing?",choices:["Deploys allowed any day with approval","No deploys on Friday or over the weekend","No deploys on Mondays","A deploy freeze only during month-end settlement"],correctIndex:1,difficulty:1,explanation:"Atlas does not deploy on Friday or over the weekend — the pipeline is gated to refuse production releases Friday through Sunday. Genuine emergencies use the incident-change path with on-call lead plus Priya sign-off (Squad Atlas — Release & Change Policy)."},{id:"atlas-pre-merge",prompt:"Which check must pass before any Atlas pull request can merge?",choices:["End-to-end load test","Ledger-reconciliation contract test","Lighthouse performance budget","Mutation-coverage threshold"],correctIndex:1,difficulty:2,explanation:"The ledger-reconciliation contract test must be green before merge — it verifies recorded entries match settled balances. A red result blocks merge with no override (Squad Atlas — Release & Change Policy)."},{id:"atlas-approvals",prompt:"How many approvals does a production change to atlas-ledger-svc require?",choices:["One approval","Two approvals (dual approval)","Three approvals","Approval from Priya only"],correctIndex:1,difficulty:2,explanation:"Every production change requires dual approval — two engineers — and one of them must have real context on the area changed; a rubber-stamp doesn't count (Squad Atlas — Release & Change Policy)."},{id:"atlas-datastore",prompt:"What is the primary datastore behind atlas-ledger-svc?",choices:["DynamoDB","Aurora PostgreSQL","MongoDB","Cassandra"],correctIndex:1,difficulty:2,explanation:"The primary datastore is Aurora PostgreSQL, with the ledger modeled append-only — rows are never updated or deleted in place, so full payment history is reconstructable for reconciliation and audit (Squad Atlas — Architecture & Datastores)."},{id:"atlas-service",prompt:"What is the name of Squad Atlas's primary service and repository?",choices:["atlas-payments-api","atlas-ledger-svc","rail-gateway","meridian-core"],correctIndex:1,difficulty:1,explanation:"atlas-ledger-svc is the primary service and repo — it holds the ledger, settlement workers, and reconciliation logic, and is where new hires spend most of their time (Squad Atlas — Charter & Ownership; Architecture & Datastores)."},{id:"atlas-rail",prompt:"What is the internal codename for Atlas's payment-initiation API?",choices:["Rail","Conduit","Gateway","Pipe"],correctIndex:0,difficulty:1,explanation:"The payment-initiation API is internally called Rail. 'Submit it to Rail' means the entry point on atlas-ledger-svc that accepts a payment instruction and hands it to the ledger (Squad Atlas — Charter & Ownership; Architecture & Datastores)."},{id:"atlas-lead",prompt:"Who is the squad lead and engineering manager of Squad Atlas?",choices:["Maya Chen","Priya Nair","David Okafor","Sofia Russo"],correctIndex:1,difficulty:1,explanation:"Priya Nair is the squad lead and EM, and the escalation point for ownership disputes and payment-path commitments. New hires should book a week-one 1:1 with her (Squad Atlas — Charter & Ownership)."},{id:"atlas-secrets",prompt:"Where does Squad Atlas store all of its secrets?",choices:["AWS Secrets Manager","In Vault, under a per-squad `atlas/` namespace","Encrypted .env files committed to the repo","Kubernetes Secrets in the cluster"],correctIndex:1,difficulty:2,explanation:"All Atlas secrets live in Vault under the dedicated per-squad namespace `atlas/`. Nothing belonging to Atlas is stored outside it, and services read from `atlas/` at runtime rather than copying secrets into code (Squad Atlas — Secrets & Access)."},{id:"atlas-sla",prompt:"What customer-facing SLA does Atlas publish for payment status availability?",choices:["99.9% monthly","99.95% monthly","99.99% monthly","99.5% monthly"],correctIndex:1,difficulty:3,explanation:"Atlas publishes a customer-facing SLA of 99.95% monthly for payment status availability — customers must be able to see a payment's state every calendar month. Breaching it triggers a customer-facing comms review (Squad Atlas — Charter & Ownership)."}]}},uses:{params:["pack"]}}],
