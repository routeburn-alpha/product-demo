<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>Quiz Arena</title>
		<!--
			Paint the saved (or OS) colour scheme before first render to avoid a
			flash of the light palette. Mirrors loadTheme() in src/lib/theme.ts;
			keep the storage key in sync.
		-->
		<script>
			try {
				var t = localStorage.getItem('quizlab.theme.v1');
				if (t !== 'light' && t !== 'dark') {
					t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
				}
				document.documentElement.dataset.theme = t;
			} catch (e) {
				/* storage/matchMedia unavailable — leave the default light palette */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
