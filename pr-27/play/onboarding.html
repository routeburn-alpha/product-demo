horing Guide style rules call for 10–15 questions per pack, with mixed difficulty rather than all level 1."},{id:"onb-6",prompt:"In Quiz Lab, what is a 'pack'?",choices:["A user's saved score history","A themed set of quiz questions shipped as one JSON file","A deployment bundle","A database table of questions"],correctIndex:1,difficulty:1,explanation:"A pack is the unit of content: a themed set of quiz questions shipped as a single JSON file (Product Vision & Glossary)."},{id:"onb-7",prompt:"What is Quiz Lab's entire deploy pipeline?",choices:["Push to a Vercel project with edge caching","Merge to main → GitHub Actions build → GitHub Pages","Manual 'npm run deploy' to an S3 bucket","A nightly cron that rebuilds the site"],correctIndex:1,difficulty:2,explanation:"A GitHub Actions workflow runs on every push to main, builds the static site, and publishes it to GitHub Pages — merging to main is the whole deploy (Architecture Overview). There is no Vercel deployment."},{id:"onb-8",prompt:"What backend and database does the live Quiz Lab app use?",choices:["Postgres behind an API server","None — it's a fully prerendered static site","DynamoDB via AppSync","Firebase Realtime Database"],correctIndex:1,difficulty:2,explanation:"Quiz Lab is a fully prerendered SvelteKit static site with no server runtime and no database; all content ships in the build (Architecture Overview). Claims of Postgres or Vercel are out-of-date marketing."},{id:"onb-9",prompt:"How does a change get onto the main branch?",choices:["Commit directly to main","Through a reviewed pull request that is squash-merged","By pushing to a long-lived release branch","An agent force-pushes once tests pass"],correctIndex:1,difficulty:2,explanation:"The team practices trunk-based development: you never commit directly to main; all work lands through a reviewed, squash-merged PR, and merging to main is what ships (Engineering Handbook)."},{id:"onb-10",prompt:"What command must pass before a pack PR can be merged?",
