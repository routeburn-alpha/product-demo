							data: [null,{type:"data",data:{pack:{id:"nyt-easy",title:"Easy Mini-Style Trivia",category:"Word play",description:"Short, breezy questions in the spirit of a daily mini puzzle. Built for warming up.",coverColor:"#0f766e",coverEmoji:"📝",addedAt:"2026-05-13",questions:[{id:"ne-1",prompt:"Tropical orange-fleshed stone fruit, five letters:",choices:["Peach","Mango","Guava","Melon"],correctIndex:1,difficulty:1,explanation:"Mango — five letters, fits the clue."},{id:"ne-2",prompt:"In the Navier–Stokes equations for incompressible viscous flow, the Reynolds-averaged closure problem arises because the momentum equations contain an unclosed term. Which tensor represents this term, and what physical phenomenon does it capture?",choices:["The viscous stress tensor τᵢⱼ = μ(∂uᵢ/∂xⱼ + ∂uⱼ/∂xᵢ), capturing molecular diffusion of momentum","The Reynolds stress tensor −ρ⟨u′ᵢu′ⱼ⟩, capturing momentum transport by turbulent velocity fluctuations","The strain-rate tensor Sᵢⱼ = ½(∂uᵢ/∂xⱼ + ∂uⱼ/∂xᵢ), capturing mean-flow deformation","The pressure-strain correlation Πᵢⱼ = p′(∂u′ᵢ/∂xⱼ + ∂u′ⱼ/∂xᵢ), capturing inter-component energy redistribution"],correctIndex:1,difficulty:3,explanation:"Reynolds-averaging the Navier–Stokes equations introduces the Reynolds stress tensor −ρ⟨u′ᵢu′ⱼ⟩, a second-order symmetric tensor formed from the time-averaged product of turbulent velocity fluctuations u′ᵢ and u′ⱼ. It represents the rate of momentum transfer driven by turbulent eddies — analogous to viscous stress but arising from inertial, not molecular, mechanisms. Because this tensor introduces six new unknowns without additional equations, the system is unclosed; turbulence models (e.g., k–ε, k–ω, Reynolds-stress transport) exist specifically to approximate it."},{id:"ne-3",prompt:"Under France's Fifth Republic, which constitutional mechanism allows the President to bypass Parliament and submit legislation directly to a popular vote, and was used controversially by de Gaulle in 1962 to elect the President by direct universal suffrage — triggering a motion of censure that brought down the Pompidou government?",choices:["Article 16 emergency powers","Article 49-3 confidence procedure","Article 11 referendum","Article 89 constitutional revision"],correctIndex:2,difficulty:3,explanation:"Article 11 of the 1958 Constitution allows the President to submit certain bills directly to referendum without parliamentary approval. De Gaulle's use of it in October 1962 to introduce direct election of the President was legally contested — critics argued Article 89 (the standard revision procedure) was required — but the referendum passed. The National Assembly responded by passing a motion of censure under Article 49-1, toppling Prime Minister Pompidou's government, though de Gaulle then dissolved the Assembly and won the subsequent elections."},{id:"ne-4",prompt:"Number of sides on a hexagon:",choices:["Five","Six","Seven","Eight"],correctIndex:1,difficulty:1,explanation:"Hex- = six. Octagon has eight, pentagon has five."},{id:"ne-5",prompt:"The Birch and Swinnerton-Dyer conjecture — one of the Millennium Prize Problems — asserts which relationship for an elliptic curve E over ℚ?",choices:["Every elliptic curve over ℚ is modular, i.e., arises from a weight-2 newform","The algebraic rank of E(ℚ) equals the order of vanishing of its L-function L(E, s) at s = 1","The group E(ℚ) is always finitely generated with torsion subgroup of order at most 12","For all primes p of good reduction, |E(𝔽ₚ)| = p + 1 − aₚ where |aₚ| ≤ 2√p"],correctIndex:1,difficulty:3,explanation:"The BSD conjecture predicts that rank(E(ℚ)) = ord_{s=1} L(E, s). Choice A is the Modularity Theorem (proved by Wiles et al.). Choice C is the Mazur torsion theorem (proved). Choice D is the Hasse bound (proved) — it defines the trace of Frobenius aₚ but says nothing about the rank."},{id:"ne-6",prompt:"Author of 'Romeo and Juliet':",choices:["Charles Dickens","Jane Austen","Mark Twain","William Shakespeare"],correct
