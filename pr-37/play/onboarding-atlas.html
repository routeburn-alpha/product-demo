							node_ids: [0, 3],
							data: [null,{type:"data",data:{pack:{id:"onboarding-atlas",title:"Squad Atlas (Payments) Onboarding",category:"Onboarding",description:"Week-one essentials for new engineers joining Meridian's Squad Atlas — on-call, compliance, releases, data, architecture, and secrets.",coverColor:"#1E3A8A",coverEmoji:"💳",addedAt:"2026-06-01",questions:[{id:"atlas-oncall-tool",prompt:"Which tool does Squad Atlas use to run its on-call rotation and page the primary engineer?",choices:["PagerDuty","Opsgenie","VictorOps","xMatters"],correctIndex:1,difficulty:1,explanation:"Atlas runs its on-call rotation through Opsgenie; keep the app installed on your phone and test push notifications before your first shift (Squad Atlas — On-Call Runbook)."},{id:"atlas-oncall-ack-sla",prompt:"When an Atlas alert fires, how long does the primary on-call engineer have to acknowledge it before Opsgenie escalates?",choices:["5 minutes","10 minutes","15 minutes","30 minutes"],correctIndex:1,difficulty:1,explanation:"Alerts route to the primary on-call with a 10-minute acknowledgement SLA; missing it escalates to the secondary, then the squad lead (Squad Atlas — On-Call Runbook)."},{id:"atlas-incident-sev",prompt:"On Squad Atlas, a failed payment settlement is classified as which incident severity?",choices:["Sev1","Sev2","Sev3","Sev4"],correctIndex:0,difficulty:3,explanation:"Severity is set by impact to money movement: a failed settlement impacts money movement, so it is Sev1 — never downgrade it to Sev2 because 'only a few payments' failed (Squad Atlas — On-Call Runbook)."},{id:"atlas-compliance-regime",prompt:"Because Atlas handles cardholder data directly, under which compliance regime does the squad operate?",choices:["SOC 2 Type II","ISO 27001","PCI-DSS Level 1","GDPR"],correctIndex:2,difficulty:1,explanation:"As Meridian's highest-volume card processor, Atlas operates under PCI-DSS Level 1 — the strictest tier — and every engineer completes PCI awareness training before production access (Squad Atlas — Compliance & Data Handling)."},{id:"atlas-card-data-tier",prompt:"How is card data classified in Meridian's data tiers as handled by Squad Atlas?",choices:["Tier 0 (Restricted)","Tier 1 (Confidential)","Tier 2 (Internal)","Tier 3 (Public)"],correctIndex:0,difficulty:2,explanation:"Card data is Tier 0 (Restricted), Meridian's highest data tier: it may never be logged, never appear in error messages, and never leave the boundary of PCI-scope services (Squad Atlas — Compliance & Data Handling)."},{id:"atlas-release-window",prompt:"What does Squad Atlas's release policy say about when production deploys may happen?",choices:["Deploys allowed any day during business hours","No deploys on Friday or over the weekend","No deploys on Mondays","Deploys only during a nightly release window"],correctIndex:1,difficulty:1,explanation:"Because Atlas runs money movement, the pipeline is gated to refuse production releases Friday through Sunday; a fix that truly can't wait goes through the incident-change path with on-call lead plus Priya sign-off (Squad Atlas — Release & Change Policy)."},{id:"atlas-release-approvals",prompt:"How many approvals does every Atlas production change require before release?",choices:["One approval from any engineer","Dual approval — two engineers, one with context on the area","Approval from the squad lead only","Three approvals including a security reviewer"],correctIndex:1,difficulty:2,explanation:"Every production change needs dual approval, and one of the two approvers must have context on the area changed — a rubber-stamp from someone unfamiliar with the ledger does not count (Squad Atlas — Release & Change Policy)."},{id:"atlas-premerge-check",prompt:"Which mandatory check must pass before any Atlas pull request can merge?",choices:["The end-to-end Rail smoke test","The ledger-reconciliation contract test","100% unit-test code coverage","A load test against Aurora"],correctIndex:1,difficulty:2,explanation:"The ledger-reconciliation contract test must be green before merge — it verifies that recorded entries match settled balances. A red result blocks merge with no exceptions and no override (Squad Atlas — Release & Change Policy)."},{id:"atlas-datastore",prompt:"What is Squad Atlas's primary datastore for the ledger?",choices:["Aurora PostgreSQL","DynamoDB","MongoDB","Cassandra"],correctIndex:0,difficulty:1,explanation:"The primary datastore is Aurora PostgreSQL, modeled as an append-only ledger — strong consistency for balance reads and the durability money movement demands (Squad Atlas — Architecture & Datastores)."},{id:"atlas-ledger-model",prompt:"How is the Atlas ledger modeled in its datastore?",choices:["Mutable balances updated in place","Append-only — corrections are new offsetting entries, rows are never updated or deleted","Event-sourced with periodic snapshots replacing history","A nightly-rebuilt materialized view"],correctIndex:1,difficulty:2,explanation:"The ledger is append-only: rows are never updated or deleted in place, corrections are new entries that offset prior ones, so the full history is reconstructable — this is what makes reconciliation and audit possible (Squad Atlas — Architecture & Datastores)."},{id:"atlas-service-name",prompt:"What is the name of Squad Atlas's primary service and repository?",choices:["payments-core","rail-gateway","atlas-ledger-svc","meridian-settle"],correctIndex:2,difficulty:1,explanation:"atlas-ledger-svc is the primary service and repo where the ledger, settlement workers, and reconciliation logic live — new hires should clone it first (Squad Atlas — Charter & Ownership / Architecture & Datastores)."},{id:"atlas-payment-api",prompt:"What is the internal codename for Atlas's payment-initiation API?",choices:["Rail","Conduit","Ingress","Flow"],correctIndex:0,difficulty:2,explanation:"Rail is the internal name for the payment-initiation endpoint on atlas-ledger-svc; 'submit it to Rail' means hand a payment instruction to the entry point that validates and records it (Squad Atlas — Charter & Ownership / Architecture & Datastores)."},{id:"atlas-squad-lead",prompt:"Who is Squad Atlas's squad lead and engineering manager?",choices:["Priya Nair","Marcus Chen","Elena Rossi","David Okafor"],correctIndex:0,difficulty:1,explanation:"Priya Nair is the squad lead and EM, and the escalation point for ownership disputes, hiring, and cross-squad commitments touching the payment path — book a week-one 1:1 with her (Squad Atlas — Charter & Ownership)."},{id:"atlas-secrets",prompt:"Where does Squad Atlas store all of its secrets?",choices:["AWS Secrets Manager, tagged per service","Vault, under a dedicated per-squad namespace 'atlas/'","Encrypted .env files committed to each repo","A shared org-wide Vault root path"],correctIndex:1,difficulty:3,explanation:"All Atlas secrets live in Vault under the dedicated per-squad namespace 'atlas/'; nothing belonging to Atlas is stored outside it, and services read from 'atlas/' at runtime rather than copying secrets into code (Squad Atlas — Secrets & Access)."},{id:"atlas-customer-sla",prompt:"What customer-facing SLA does Squad Atlas publish for payment status availability?",choices:["99.9% monthly","99.95% monthly","99.99% monthly","99.5% monthly"],correctIndex:1,difficulty:3,explanation:"Atlas publishes a customer-facing SLA of 99.95% monthly for payment status availability; breaching it triggers a customer-facing comms review, so the status path is treated as a first-class concern (Squad Atlas — Charter & Ownership)."}]}},uses:{params:["pack"]}}],
