							data: [null,{type:"data",data:{pack:{id:"cuisines",title:"Best Restaurants & Cuisines",category:"Food",description:"World cuisines, famous restaurants, and the techniques behind them.",questions:[{id:"cuisine-1",prompt:"Which Hollywood actor co-founded the Nobu restaurant empire with chef Nobuyuki Matsuhisa when the flagship New York location opened in 1994?",choices:["Al Pacino","Robert De Niro","Jack Nicholson","Morgan Freeman"],correctIndex:1,difficulty:1,explanation:"Robert De Niro partnered with chef Nobuyuki 'Nobu' Matsuhisa and producer Meir Teper to open Nobu New York in 1994, launching what became a global empire of over 50 restaurants (noburestaurants.com; Wikipedia: 'Nobu Matsuhisa')."},{id:"cuisine-4",prompt:"Which Italian city is widely regarded as the birthplace of pizza, including the classic Margherita?",choices:["Rome","Naples","Milan","Florence"],correctIndex:1,difficulty:1,explanation:"Modern pizza was born in Naples in the 1700s–1800s; the Margherita is traditionally said to have been created there in 1889 in honor of Queen Margherita of Savoy. Neapolitan 'pizzaiuolo' craft now holds UNESCO intangible cultural heritage status (Wikipedia: 'Neapolitan pizza'; UNESCO)."},{id:"cuisine-5",prompt:"What name did Japanese chemist Kikunae Ikeda give in 1908 to the savory 'fifth taste' he identified in kombu seaweed broth?",choices:["Umami","Dashi","Teriyaki","Ponzu"],correctIndex:0,difficulty:1,explanation:"In 1908 Kikunae Ikeda isolated glutamate from kombu and named the savory taste 'umami' ('pleasant savory taste'), now recognized as one of the five basic tastes (Wikipedia: 'Umami'; 'Kikunae Ikeda')."},{id:"technique-1",prompt:"Which cooking technique involves briefly boiling food, then plunging it into ice water to halt the cooking?",choices:["Blanching","Braising","Poaching","Searing"],correctIndex:0,difficulty:1,explanation:"Blanching scalds food in boiling water and then 'shocks' it in ice water to stop cooking, set color, and loosen skins —
